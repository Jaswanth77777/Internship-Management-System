<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InternHub 3D Portal</title>
<style>
:root{--bg:#eef0fa;--sf:#fff;--tx:#161a2e;--mu:#5b6280;--ac:#5b5bf0;--sh:#3a3ab0;--ac2:#00a88f;--bd:#d5d9ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0e1d;--sf:#141937;--tx:#eef0ff;--mu:#9aa2c8;--ac:#7b7bff;--sh:#4040c0;--ac2:#2ee6c5;--bd:#2a3263}}
:root[data-theme="dark"]{--bg:#0b0e1d;--sf:#141937;--tx:#eef0ff;--mu:#9aa2c8;--ac:#7b7bff;--sh:#4040c0;--ac2:#2ee6c5;--bd:#2a3263}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}#app{position:relative;z-index:1}
.glass{background:color-mix(in srgb,var(--sf) 85%,transparent);backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:20px}
#lg{min-height:100vh;display:grid;place-items:center;perspective:1100px;padding:20px}
.lc{width:min(430px,94vw);padding:28px;transform-style:preserve-3d;transition:transform .12s;box-shadow:0 40px 80px rgba(20,20,80,.35)}
.lc{position:relative;animation:fl 6s ease-in-out infinite}@keyframes fl{50%{translate:0 -12px}}.lc::before{content:"";position:absolute;inset:-3px;border-radius:23px;z-index:-1;background:conic-gradient(from var(--a,0deg),#7b7bff,#2ee6c5,#ff6b9d,#ffb84d,#7b7bff);filter:blur(12px);opacity:.75;animation:sp 5s linear infinite}@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}@keyframes sp{to{--a:360deg}}.lc h1{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}.lc>*{transform:translateZ(30px)}.lc h1{margin:0 0 4px;font-size:1.8rem}.lc p{color:var(--mu);margin:0 0 14px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
input,select,textarea{width:100%;padding:10px 12px;margin:4px 0 10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
label{font-size:12px;color:var(--mu);font-weight:600}
.b,.chip{border:0;border-radius:12px;padding:10px 16px;background:var(--ac);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 5px 0 var(--sh);transition:transform .08s,box-shadow .08s;font:inherit;font-weight:700}
.b:active,.chip:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sh)}
.chip{background:var(--sf);color:var(--tx);box-shadow:0 5px 0 var(--bd);border:1px solid var(--bd)}.chip.on{background:var(--ac);color:#fff;box-shadow:0 5px 0 var(--sh)}
.b.sm{padding:5px 10px;font-size:12px;box-shadow:0 3px 0 var(--sh);margin:2px}.b.red{background:#e0476a;box-shadow:0 3px 0 #a02a48}.b.am{background:#e29a1a;box-shadow:0 3px 0 #9a6608}.b:disabled{opacity:.4;cursor:not-allowed}
#err{color:#e0476a;font-size:13px;min-height:18px}
.pt{display:grid;grid-template-columns:240px 1fr;gap:18px;padding:16px;min-height:100vh;perspective:1400px}
.side{padding:16px;align-self:start;position:sticky;top:16px}.side h3{margin:0 0 2px}.side small{color:var(--mu)}
.mi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--tx);padding:10px 12px;margin-top:6px;border-radius:12px;cursor:pointer;font:inherit;transition:transform .2s,background .2s}
.mi:hover{transform:translateX(6px) rotateY(-10deg) translateZ(12px);background:var(--bg)}.mi.on{background:var(--ac);color:#fff;transform:translateX(8px) translateZ(14px);box-shadow:0 8px 20px rgba(91,91,240,.4)}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;margin-bottom:16px}
.panel{padding:22px;animation:in .5s}@keyframes in{from{opacity:0;transform:rotateX(-14deg) translateY(24px)}}
.panel h2{margin:0 0 12px}
.how{border:1px dashed var(--ac2);border-radius:14px;padding:10px 14px;color:var(--mu);font-size:13.5px;margin-top:16px;line-height:1.6}.how b{color:var(--ac2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.tile{background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:16px;transition:transform .2s;box-shadow:0 8px 0 var(--bd)}.tile:hover{transform:translateY(-6px) rotateX(8deg)}.tile b{display:block;font-size:1.8rem;color:var(--ac)}
.item{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--mu);font-size:12px}
.bd{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}.g{background:#12a97a33;color:var(--ac2)}.a{background:#e29a1a33;color:#d98a00}.r{background:#e0476a33;color:#e0476a}
.bar{height:16px;border-radius:8px;background:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 4px 0 var(--bd);transition:width .8s}.tile,.item,.panel,.side,.top{transform-style:preserve-3d;backface-visibility:hidden}.b:focus-visible,.chip:focus-visible,.mi:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac2);outline-offset:3px}.mi{min-height:42px}.side{box-shadow:0 18px 45px rgba(20,20,80,.12)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}@media(max-width:800px){.side{z-index:2}.side nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}.mi{margin-top:2px;padding:9px;font-size:13px}.top{gap:8px;flex-wrap:wrap}.panel{padding:16px}table{display:block;overflow-x:auto;white-space:nowrap}}
.item{transition:transform .25s,box-shadow .25s;box-shadow:0 5px 0 var(--bd)}.item:hover{transform:translateZ(20px) rotateX(4deg) translateY(-3px);box-shadow:0 14px 26px rgba(91,91,240,.28)}.panel{transform-style:preserve-3d}.tile:nth-child(odd){animation:bob 4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#md{position:fixed;inset:0;z-index:8;display:none;place-items:center;background:rgba(5,5,30,.62);perspective:1000px;padding:16px}#md.on{display:grid}.mdb{width:min(580px,100%);max-height:90vh;overflow:auto;padding:24px;animation:pop .5s}@keyframes pop{from{transform:rotateX(40deg) scale(.7);opacity:0}}#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ac);color:#fff;padding:12px 20px;border-radius:14px;z-index:9;transition:.4s;max-width:90vw}#toast.on{transform:translateX(-50%)}
@media(max-width:800px){.pt{grid-template-columns:1fr}.side{position:static}.row2{grid-template-columns:1fr}}
</style></head><body>
<canvas id="bg"></canvas><div id="md"></div><div id="app"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),v=i=>$('#'+i).value;
const DB={jobs:[{id:1,t:'Frontend Intern',c:'TechNova',s:15000,m:'Remote',d:'3 mo',ok:1,gpa:7,br:'CSE / IT',sub:'Web Technologies, Data Structures, DBMS',sk:'HTML, CSS, JavaScript, React',ab:'Build responsive screens for the company dashboard under a senior mentor.',tk:'Convert designs to React components, fix UI bugs, write unit tests.',last:'30 Nov 2026'},{id:2,t:'Data Analyst Intern',c:'DataWave',s:12000,m:'On-site',d:'2 mo',ok:1,gpa:7.5,br:'CSE / IT / ECE',sub:'Statistics, Python, DBMS',sk:'Python, SQL, Excel, Power BI',ab:'Clean sales data and build weekly reports for the analytics team.',tk:'Write SQL queries, make dashboards, present findings every Friday.',last:'25 Nov 2026'},{id:3,t:'ML Intern',c:'TechNova',s:20000,m:'Remote',d:'6 mo',ok:1,gpa:8.5,br:'CSE / AI&DS',sub:'Machine Learning, Linear Algebra, Python',sk:'Python, NumPy, scikit-learn, TensorFlow',ab:'Train and test small ML models for a recommendation feature.',tk:'Prepare datasets, train models, document accuracy results.',last:'20 Nov 2026'},{id:4,t:'Backend Intern',c:'CloudBay',s:10000,m:'On-site',d:'3 mo',ok:0,gpa:7,br:'CSE / IT',sub:'Operating Systems, Networks, DBMS',sk:'Node.js, REST APIs, MongoDB',ab:'Help build REST APIs for the cloud billing service.',tk:'Write API endpoints, test with Postman, fix backend bugs.',last:'28 Nov 2026'}],apps:[],nocs:[],logs:[],evals:[],docs:[],ann:[],cos:[{n:'TechNova',st:'Verified'},{n:'DataWave',st:'Verified'},{n:'CloudBay',st:'Pending Verification'}],notes:[],stu:[{id:1,n:'Riya',f:'f1'},{id:2,n:'Arjun',f:null},{id:3,n:'Meena',f:null}],P:{branch:'CSE',gpa:'8.4',skills:'React, Node',link:'github.com/riya',res:'resume.pdf'}};
// Demo persistence: records survive refreshes in this browser only. This is not a shared server database.
try {
  const saved = JSON.parse(localStorage.getItem('internhub_demo_db') || 'null');
  if (saved && typeof saved === 'object') {
    Object.keys(DB).forEach(k => {
      if (Array.isArray(DB[k]) && Array.isArray(saved[k])) DB[k] = saved[k];
      else if (k === 'P' && saved.P && typeof saved.P === 'object') DB.P = {...DB.P, ...saved.P};
    });
  }
} catch (e) { console.warn('Saved demo data could not be loaded', e); }
function persistDB() {
  try { localStorage.setItem('internhub_demo_db', JSON.stringify(DB)); }
  catch (e) { toast('Browser storage is full or unavailable'); }
}
const US={student:{n:'Riya (Student)',e:'student@college.edu'},faculty:{n:'Dr. Mehta (Faculty)',e:'faculty@college.edu'},company:{n:'TechNova HR (Mentor)',e:'hr@technova.com'},admin:{n:'T&P Officer (Admin)',e:'admin@college.edu'}};
const M={student:[['dash','🏠','Dashboard'],['prof','👤','Profile & Resume'],['jobs','📋','Internships'],['apps','📝','My Applications'],['noc','📑','NOC Request'],['log','📅','Weekly Logbook'],['docs','📤','Final Documents'],['note','🔔','Notifications']],faculty:[['dash','🏠','Dashboard'],['nocs','✅','NOC Approvals'],['stu','👨‍🏫','My Students'],['note','🔔','Notifications']],company:[['post','🏢','Post a Job'],['cand','🎯','Candidates'],['ver','🔗','Verify Logs'],['evl','⭐','Evaluation'],['note','🔔','Notifications']],admin:[['ana','📊','Analytics'],['alloc','🧑‍🏫','Allocate Students'],['appr','✅','Approve Jobs'],['cos','🏢','Verify Companies'],['ev','⭐','Evaluations'],['ann','📢','Announcements'],['all','🗂️','All Records'],['users','👥','User Directory'],['reports','📈','Reports & Export'],['settings','⚙️','Portal Settings'],['note','🔔','Notifications']]};
let role=null,cur='',uid=10,F={m:'',s:0},sel='student';
const how=(a,b)=>`<div class="how"><b>In real life:</b> ${a}<br><b>Technical flow:</b> ${b}</div>`;
const bd=s=>`<span class="bd ${/Pending|Changes/.test(s)?'a':/Appr|Verif|Hired/.test(s)?'g':/Rej|Locked|Blocked/.test(s)?'r':'a'}">${s}</span>`;
const tb=(h,r)=>r.length?`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</table>`:'<p style="color:var(--mu)">Nothing here yet.</p>';
const tile=(n,l)=>`<div class="tile"><b>${n}</b>${l}</div>`;
const n=(r,m)=>DB.notes.push({r,m,t:new Date().toLocaleTimeString()});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('on'),2800)}
const A={
 sel(r){sel=r;login()},
 view(id){const j=DB.jobs.find(x=>x.id==id),ap=DB.apps.some(a=>a.j==j.t&&a.c==j.c),h=DB.apps.some(a=>a.st=='Hired');$('#md').innerHTML=`<div class="mdb glass"><h2>${j.t}</h2><p><b>${j.c}</b> · ${j.m} · ${j.d} · ₹${j.s}/month</p><div class="how" style="margin:0 0 12px"><b>About:</b> ${j.ab}<br><b>Daily tasks:</b> ${j.tk}<br><b>Subjects needed:</b> ${j.sub}<br><b>Skills:</b> ${j.sk}<br><b>Eligibility:</b> GPA ${j.gpa}+ · ${j.br} (your GPA: ${DB.P.gpa})<br><b>Last date:</b> ${j.last}<br><b>Before applying:</b> Check your branch and GPA, tailor your resume to the listed skills, verify the deadline, and keep your college NOC requirements ready.</div><label>Resume version</label><select id="rv"><option>${DB.P.res} (main)</option><option>resume_v2.pdf</option></select><button class="b" ${ap||h?'disabled':''} onclick="A.apply(${j.id})">${ap?'Already applied':h?'Locked: already hired':'Apply now'}</button> <button class="chip" onclick="A.close()">Close</button></div>`;$('#md').className='on'},
 close(){$('#md').className=''},
 jok(id,x){const j=DB.jobs.find(a=>a.id==id),c=DB.cos.find(a=>a.n==j.c);if(x&&c&&c.st!='Verified'){toast('Verify the company first');return}j.ok=x;n('company',j.t+(x?' approved':' unpublished'));toast(x?'Job approved and live':'Job unpublished');go('appr')},
 cs(nm,st){DB.cos.find(c=>c.n==nm).st=st;toast(nm+': '+st);go('cos')},
 an(){const m=v('am').trim();if(!m){toast('Write a message first');return}['student','faculty','company'].forEach(r=>n(r,'📢 '+m));DB.ann.push(m);toast('Announcement added to demo notifications');go('ann')},
 in(){const u=US[sel];if(v('em')!==u.e||v('pw')!=='demo123'){$('#err').textContent='Wrong email or password (use demo123)';return}role=sel;toast('Demo sign-in successful · session is local to this browser');go(M[role][0][0])},
 out(){role=null;login()},
 prof(){const g=Number(v('pg'));if(!Number.isFinite(g)||g<0||g>10){toast('GPA must be between 0 and 10');return}DB.P={branch:v('pb').trim(),gpa:String(g),skills:v('ps').trim(),link:v('pl').trim(),res:DB.P.res};persistDB();toast('Profile saved')},
 res(e){const f=e.files[0];if(f){DB.P.res=f.name;toast('Resume selected for this browser demo: '+f.name)}},
 f(k,x){F[k]=x;go('jobs')},
 apply(id){const j=DB.jobs.find(x=>x.id==id);if(!j||!j.ok){toast('This internship is not currently open');return}if(+DB.P.gpa<j.gpa){toast('Not eligible: minimum GPA is '+j.gpa);return}if(DB.apps.some(a=>a.j===j.t&&a.c===j.c)){toast('You have already applied for this internship');return}if(DB.apps.some(a=>a.s==='Riya'&&a.st==='Hired')){toast('Your profile is locked because you already have an offer');return}DB.apps.push({id:++uid,j:j.t,c:j.c,s:'Riya',st:'Applied',rs:v('rv'),at:new Date().toLocaleDateString()});n('company','Riya applied for '+j.t);n('student','Application sent: '+j.t);A.close();toast('Applied! The company can now see your resume');go('jobs')},
 setApp(id,st){const a=DB.apps.find(x=>x.id==id);a.st=st;n('student',a.j+': '+st);if(st=='Hired')DB.apps.forEach(o=>{if(o!==a&&o.s==a.s&&o.st!='Hired')o.st='Locked'});toast('Marked '+st);go('cand')},
 noc(){if(!v('ns')||!v('ne')||v('ne')<v('ns')){toast('Choose valid start and end dates');return}DB.nocs.push({id:++uid,co:v('nc'),hr:v('nh'),d:v('ns')+' → '+v('ne'),st:'Pending Faculty Approval'});n('faculty','New NOC request from Riya');toast('NOC submitted');go('noc')},
 nocSet(id,st){const x=DB.nocs.find(a=>a.id==id);x.st=st;n('student','NOC '+st+(st=='Approved'?' · signed PDF emailed':''));toast('NOC '+st+' in this demo');go('nocs')},
 log(){const h=+v('lh');if(!v('la').trim()||!(h>0&&h<=60)){toast('Enter an activity and hours (1-60)');return}DB.logs.push({id:++uid,a:v('la'),t:v('lt'),h:h,s:'Riya',st:'Pending'});n('company','Riya submitted a weekly log (magic link emailed)');toast('Log saved in this demo portal');go('log')},
 ver(id){const l=DB.logs.find(x=>x.id==id);l.st='Verified';n('faculty','A weekly log was verified by the mentor');n('student','Mentor verified your log');toast('Log marked verified in this demo');go('ver')},
 doc(e){const f=e.files[0];if(!f)return;if(!/pdf$/i.test(f.name)||f.size>1e7){toast('Rejected: only PDF under 10MB');e.value='';return}DB.docs.push(f.name);toast('File added to this browser demo: '+f.name);go('docs')},
 post(){if(!v('jt').trim()||!(+v('js')>0)){toast('Enter a title and stipend');return}DB.jobs.push({id:++uid,t:v('jt'),c:'TechNova',s:+v('js'),m:v('jm'),d:v('jd'),ok:0,gpa:+v('jg')||0,br:'All branches',sub:v('jsb'),sk:v('jsk'),ab:v('jab'),tk:v('jab'),last:'30 Dec 2026'});n('admin','TechNova posted a new job: '+v('jt'));toast('Sent to admin for approval');go('post')},
 ev(){DB.evals.push({tech:+v('e1'),p:+v('e2'),c:+v('e3')});n('faculty','Mentor evaluation received for Riya');toast('Evaluation saved');go('evl')},
 alloc(){const ids=[...document.querySelectorAll('.ck:checked')].map(x=>+x.value);if(!ids.length){toast('Select at least one student');return}ids.forEach(i=>DB.stu.find(s=>s.id==i).f=v('fa'));n('faculty','Admin assigned you '+ids.length+' student(s)');toast(ids.length+' student(s) assigned');go('alloc')}
};
const jobsF=()=>DB.jobs.filter(j=>j.ok&&(!F.m||j.m==F.m)&&j.s>=F.s);
const P={
'student.dash':()=>`<h2>Student Dashboard</h2><div class="tiles">${tile(DB.apps.length,'Applications')}${tile(DB.nocs.length,'NOC requests')}${tile(DB.logs.length,'Weekly logs')}${tile(DB.docs.length,'Final docs')}</div>`+how('Student sees everything about their internship in one place.','Prototype note: counts are calculated from sample records in this browser. A production build needs GET /api/me/summary, server-side sessions, and database-backed authorization.'),
'student.prof':()=>`<h2>Profile &amp; Resume</h2><div class="row2"><div><label>Branch</label><input id="pb" value="${DB.P.branch}"></div><div><label>GPA</label><input id="pg" value="${DB.P.gpa}"></div></div><label>Skills</label><input id="ps" value="${DB.P.skills}"><label>GitHub / LinkedIn</label><input id="pl" value="${DB.P.link}"><label>Resume (current: ${DB.P.res})</label><input type="file" onchange="A.res(this)"><button class="b" onclick="A.prof()">Save profile</button>`+how('Fill academic details and upload your resume.','Demo note: the selected filename is stored in browser state only. Production needs validated file upload, private object storage, malware scanning, and short-lived signed download URLs.'),
'student.jobs':()=>`<h2>Internship Search</h2><div class="row2"><div><label>Mode</label><select onchange="A.f('m',this.value)"><option value="">Any</option><option ${F.m=='Remote'?'selected':''}>Remote</option><option ${F.m=='On-site'?'selected':''}>On-site</option></select></div><div><label>Minimum stipend</label><select onchange="A.f('s',+this.value)"><option value="0">Any</option><option value="12000" ${F.s==12000?'selected':''}>12000+</option><option value="15000" ${F.s==15000?'selected':''}>15000+</option></select></div></div>`+jobsF().map(j=>{const ap=DB.apps.some(a=>a.j==j.t&&a.c==j.c);return`<div class="item"><div><b>${j.t}</b> · ${j.c}<br><small>₹${j.s}/mo · ${j.m} · ${j.d}</small><br><small>📚 Subjects: ${j.sub}</small></div><button class="b sm" onclick="A.view(${j.id})">${ap?'Applied ✔ View':'View details &amp; Apply'}</button></div>`}).join('')+how('Browse verified postings with filters, then apply in one click.','GET /api/internships?location=remote&min_stipend=10000 → indexed query → paginated JSON. Apply creates a row in applications (status Applied + applied_at).'),
'student.apps':()=>`<h2>My Applications</h2>`+tb(['Role','Company','Status'],DB.apps.map(a=>[a.j,a.c,bd(a.st)]))+how('Track every application until you are hired.','Status field in the applications table changes when the company shortlists or hires; you get an email + live alert.'),
'student.noc':()=>`<h2>NOC Request</h2><div class="row2"><div><label>Company</label><input id="nc" value="TechNova"></div><div><label>HR email</label><input id="nh" value="hr@technova.com"></div><div><label>Start</label><input id="ns" type="date"></div><div><label>End</label><input id="ne" type="date"></div></div><button class="b" onclick="A.noc()">Submit NOC request</button><br><br>`+tb(['Company','Dates','Status'],DB.nocs.map(x=>[x.co,x.d,bd(x.st)]))+how('Off-campus internships need a No Objection Certificate from the college.','Form saved in noc_requests with status Pending Faculty Approval; faculty is notified.'),
'student.log':()=>`<h2>Weekly Logbook</h2><label>Activities this week</label><textarea id="la" rows="2">Built login page</textarea><div class="row2"><div><label>Technologies learned</label><input id="lt" value="React"></div><div><label>Hours</label><input id="lh" value="40"></div></div><button class="b" onclick="A.log()">Submit log</button><br><br>`+tb(['Activity','Tech','Hrs','Status'],DB.logs.map(l=>[l.a,l.t,l.h,bd(l.st)]))+how('Every Friday you record work done; your company mentor verifies it.','Demo note: the log entry is stored in this browser. Production needs a weekly_logs table, expiring one-time mentor tokens, server-side verification, and email delivery.'),
'student.docs':()=>`<h2>Final Documents</h2><label>Upload report / certificate / NOC copy (PDF, max 10MB)</label><input type="file" onchange="A.doc(this)">`+tb(['Uploaded files'],DB.docs.map(d=>[d]))+how('At the end, upload your final report and certificates.','Server checks size and MIME type (PDF under 10MB), then stores the file in S3. Try uploading a non-PDF to see the rejection.'),
'faculty.dash':()=>`<h2>Faculty Dashboard</h2><div class="tiles">${tile(DB.nocs.filter(x=>/Pending/.test(x.st)).length,'NOCs pending')}${tile(DB.stu.filter(s=>s.f=='f1').length,'My students')}${tile(DB.logs.filter(l=>l.st=='Verified').length,'Verified logs')}</div>`+how('Faculty supervises students academically.','Dashboard queries filter by faculty_id from the JWT.'),
'faculty.nocs':()=>`<h2>NOC &amp; Application Approval</h2>`+(DB.nocs.map(x=>`<div class="item"><div><b>Riya → ${x.co}</b><br><small>${x.d} · ${x.hr}</small><br>${bd(x.st)}</div><div><button class="b sm" onclick="A.nocSet(${x.id},'Approved')">Approve</button><button class="b sm am" onclick="A.nocSet(${x.id},'Changes Requested')">Request changes</button><button class="b sm red" onclick="A.nocSet(${x.id},'Rejected')">Reject</button></div></div>`).join('')||'<p style="color:var(--mu)">No NOC requests yet. Submit one from the Student portal.</p>')+how('HOD reviews the NOC and approves, rejects or asks for changes.','Approve → status = Approved → backend generates a digitally signed PDF (pdfkit/puppeteer) and emails it to the student.'),
'faculty.stu':()=>`<h2>My Students</h2>`+tb(['Student','Verified logs'],DB.stu.filter(s=>s.f=='f1').map(s=>[s.n,s.n=='Riya'?DB.logs.filter(l=>l.st=='Verified').length:0]))+how('See students allocated to you and their verified progress.','students.assigned_faculty_id = your id; logs are joined from weekly_logs where status = Verified.'),
'company.post':()=>`<h2>Post a Job</h2><div class="row2"><div><label>Title</label><input id="jt" value="UI Intern"></div><div><label>Stipend/month</label><input id="js" value="14000"></div><div><label>Mode</label><select id="jm"><option>Remote</option><option>On-site</option></select></div><div><label>Duration</label><input id="jd" value="3 mo"></div></div><label>Subjects required</label><input id="jsb" value="DBMS, Operating Systems"><label>Skills</label><input id="jsk" value="Python, SQL"><label>About the role &amp; tasks</label><textarea id="jab" rows="2">Work with a mentor on live project tasks.</textarea><label>Minimum GPA</label><input id="jg" value="7"><button class="b" onclick="A.post()">Submit for admin approval</button><h3>My postings</h3>${tb(['Role','Status'],DB.jobs.filter(j=>j.c=='TechNova').map(j=>[j.t,bd(j.ok?'Approved':'Pending Admin Approval')]))}`+how('HR posts an open position.','Row inserted in internships; students see it instantly in search.'),
'company.cand':()=>`<h2>Candidates</h2>`+(DB.apps.filter(a=>a.c=='TechNova').map(a=>`<div class="item"><div><b>${a.s}</b> · ${a.j}<br><small>📄 ${a.rs} · GPA ${DB.P.gpa} · ${DB.P.skills}</small><br>${bd(a.st)}</div><div><button class="b sm am" onclick="A.setApp(${a.id},'Shortlisted')">Shortlist</button><button class="b sm" onclick="A.setApp(${a.id},'Hired')">Hire</button></div></div>`).join('')||'<p style="color:var(--mu)">No applicants yet. Apply to a TechNova job as a student.</p>')+how('Review profiles, download resumes, shortlist or hire.','Hired triggers an email and locks the student profile (one offer per student): their other applications become Locked.'),
'company.ver':()=>`<h2>Verify Weekly Logs (magic link)</h2>`+(DB.logs.map(l=>`<div class="item"><div><b>${l.a}</b><br><small>${l.t} · ${l.h} hrs</small><br>${bd(l.st)}</div><button class="b sm" ${l.st=='Verified'?'disabled':''} onclick="A.ver(${l.id})">Open link &amp; approve</button></div>`).join('')||'<p style="color:var(--mu)">No logs yet.</p>')+how('The mentor clicks a link in the email and approves in one click, no account needed.','Link looks like /verify/token_xyz123; server validates the one-time token, sets status Verified and alerts faculty.'),
'company.evl':()=>`<h2>Final Evaluation of Riya</h2><div class="row2">${[['e1','Technical'],['e2','Punctuality'],['e3','Communication']].map(x=>`<div><label>${x[1]} (1-5)</label><select id="${x[0]}">${[5,4,3,2,1].map(i=>`<option>${i}</option>`).join('')}</select></div>`).join('')}</div><button class="b" onclick="A.ev()">Submit evaluation</button>`+how('Mentor rates the intern at the end.','Saved in evaluations table and combined with the internal faculty score.'),
'admin.ana':()=>{const t=DB.apps.length||1,c=s=>DB.apps.filter(a=>a.st==s).length,av=DB.evals.length?(DB.evals.reduce((s,e)=>s+e.tech+e.p+e.c,0)/DB.evals.length/3).toFixed(1):'–';return`<h2>Analytics &amp; Compliance</h2><div class="tiles">${tile(c('Hired'),'Placed')}${tile(DB.apps.length,'Applications')}${tile(DB.jobs.length,'Open jobs')}${tile(av,'Avg rating')}${tile('₹'+Math.round(DB.jobs.filter(j=>j.ok).reduce((s,j)=>s+j.s,0)/Math.max(1,DB.jobs.filter(j=>j.ok).length)),'Avg stipend')}</div><br>`+['Applied','Shortlisted','Hired'].map(s=>`<p>${s} (${c(s)})</p><div class="bar" style="width:${Math.max(3,c(s)/t*100)}%"></div>`).join('')+how('T&P officers watch placements and pending work.','Aggregation queries (COUNT, AVG, GROUP BY) feed Chart.js / Recharts.')},
'admin.alloc':()=>`<h2>Allocate Students to Faculty</h2>`+DB.stu.map(s=>`<div class="item"><label><input class="ck" style="width:auto" type="checkbox" value="${s.id}"> ${s.n}</label><span>${s.f?(s.f=='f1'?'Dr. Mehta':'Dr. Rao'):'Unassigned'}</span></div>`).join('')+`<label>Faculty guide</label><select id="fa"><option value="f1">Dr. Mehta</option><option value="f2">Dr. Rao</option></select><button class="b" onclick="A.alloc()">Assign selected</button>`+how('Placement cell gives each student an internal guide.','UPDATE students SET assigned_faculty_id = ? WHERE id IN (...).'),
'admin.appr':()=>`<h2>Approve Job Postings</h2>`+DB.jobs.map(j=>`<div class="item"><div><b>${j.t}</b> · ${j.c}<br><small>📚 ${j.sub}</small><br>${bd(j.ok?'Approved':'Pending Admin Approval')}</div>${j.ok?`<button class="b sm red" onclick="A.jok(${j.id},0)">Unpublish</button>`:`<button class="b sm" onclick="A.jok(${j.id},1)">Approve</button>`}</div>`).join('')+how('Only checked postings should reach students.','Company posts with is_approved=false; admin sets it to true and the job then appears in the student search query. A job from an unverified company cannot be approved.'),
'admin.cos':()=>`<h2>Verify Companies</h2>`+DB.cos.map(c=>`<div class="item"><div><b>${c.n}</b><br>${bd(c.st)}</div><div><button class="b sm" onclick="A.cs('${c.n}','Verified')">Verify</button><button class="b sm red" onclick="A.cs('${c.n}','Blocked')">Block</button></div></div>`).join('')+how('Admin confirms a company is genuine before students see its jobs.','companies.status = Verified or Blocked. Try approving the CloudBay job before verifying CloudBay.'),
'admin.ev':()=>`<h2>Evaluations</h2>`+tb(['Technical','Punctuality','Communication','Average'],DB.evals.map(e=>[e.tech,e.p,e.c,((e.tech+e.p+e.c)/3).toFixed(1)]))+how('Company ratings are collected here and combined with faculty marks.','Rows in the evaluations table are joined with faculty scores to calculate the final result.'),
'admin.ann':()=>`<h2>Announcements</h2><label>Message to all portals</label><textarea id="am" rows="2"></textarea><button class="b" onclick="A.an()">Send to everyone</button><br><br>`+tb(['Sent messages'],DB.ann.map(a=>[a]))+how('Placement cell broadcasts deadlines and rules.','Backend writes a notification row per user and pushes a Socket.io event so the bell badge updates live.'),
'admin.all':()=>`<h2>All Records</h2><h3>Applications</h3>`+tb(['Student','Role','Status'],DB.apps.map(a=>[a.s,a.j,bd(a.st)]))+`<h3>NOC requests</h3>`+tb(['Company','Status'],DB.nocs.map(x=>[x.co,bd(x.st)]))+`<h3>Weekly logs</h3>`+tb(['Activity','Status'],DB.logs.map(l=>[l.a,bd(l.st)]))+how('Admin has read access to everything for compliance.','Role-based access control: the JWT carries role=admin so the API allows all-record queries.')
,
'admin.users':()=>`<h2>User Directory</h2><p>Demo accounts available in this prototype. Production deployment should load users from a protected server API.</p>`+tb(['Portal role','Demo identity','Login email','Access'],Object.keys(US).map(r=>[r,US[r].n,US[r].e,bd('Demo account')]))+how('Admin reviews portal roles and account ownership.','In production, enforce role-based access on the server, add account activation/deactivation, audit every admin action, and never expose password hashes or private tokens in this view.'),
'admin.reports':()=>`<h2>Reports & Export</h2><div class="tiles">${tile(DB.apps.length,'Applications')}${tile(DB.nocs.length,'NOC requests')}${tile(DB.logs.length,'Weekly logs')}${tile(DB.evals.length,'Evaluations')}</div><p>Download a snapshot of the current demo records as JSON for testing.</p><button class="b" onclick="A.exportData()">Export demo data (JSON)</button>`+how('Placement staff export records for review and reporting.','A production export should be generated by a server endpoint, permission-checked, logged, and limited to the selected date range and fields.'),
'admin.settings':()=>`<h2>Portal Settings</h2><div class="item"><div><b>Appearance</b><br><small>Switch between light and dark presentation.</small></div><button class="b sm" onclick="A.theme()">Toggle theme</button></div><div class="item"><div><b>Demo data</b><br><small>Clear locally saved demo records and restore the original sample data after refresh.</small></div><button class="b sm red" onclick="A.reset()">Reset demo data</button></div>`+how('Admin configures portal preferences and maintains demo data.','Theme is a browser preference. Production settings should be stored server-side and protected by admin permissions.')
};
const NP=()=>`<h2>Notifications</h2>`+tb(['Time','Message'],DB.notes.filter(x=>x.r==role).reverse().map(x=>[x.t,x.m]))+how('Instant alerts when something changes.','Demo note: notifications are local records. Production can use a notification API, WebSocket/SSE updates, and a configured email provider.');
function go(k){persistDB();cur=k;const u=US[role],cnt=DB.notes.filter(x=>x.r==role).length;
$('#app').innerHTML=`<div class="pt"><div class="side glass"><h3>🎓 InternHub</h3><small>${role.toUpperCase()} PORTAL</small>${M[role].map(m=>`<button class="mi ${m[0]==k?'on':''}" onclick="go('${m[0]}')">${m[1]} ${m[2]}</button>`).join('')}</div><div><div class="top glass"><b>${u.n}</b><span><button class="chip" onclick="go('note')">🔔 ${cnt}</button> <button class="chip" onclick="A.out()">Logout</button></span></div><div class="panel glass">${k=='note'?NP():P[role+'.'+k]()}</div></div></div>`}
function login(){const ch=Object.keys(US).map(r=>`<button class="chip ${r==sel?'on':''}" onclick="A.sel('${r}')">${{student:'🎓 Student',faculty:'👨‍🏫 Faculty',company:'🏢 Company',admin:'🛡️ Admin'}[r]}</button>`).join('');
$('#app').innerHTML=`<div id="lg"><div class="lc glass" id="lc"><h1>🎓 InternHub</h1><p>Pick your portal and sign in. Demo password: <b>demo123</b></p><div class="chips">${ch}</div><label>Email</label><input id="em" value="${US[sel].e}"><label>Password</label><input id="pw" type="password" value="demo123"><div id="err"></div><button class="b" style="width:100%" onclick="A.in()">Sign in securely</button></div></div>`;
const c=$('#lc');document.getElementById('lg').onmousemove=e=>{const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;c.style.transform=`rotateY(${x*18}deg) rotateX(${-y*18}deg)`}}
try{const savedTheme=localStorage.getItem('internhub_theme');if(savedTheme)document.documentElement.dataset.theme=savedTheme}catch(e){}
login();
try{const cv=$('#bg'),r=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true}),sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,1,.1,100);cam.position.z=12;
const G=[new THREE.BoxGeometry(1,1,1),new THREE.OctahedronGeometry(.8),new THREE.IcosahedronGeometry(.8)],C=[0x7b7bff,0x2ee6c5,0xff6b9d,0xffb84d],ms=[];
for(let i=0;i<34;i++){const m=new THREE.Mesh(G[i%3],new THREE.MeshBasicMaterial({color:C[i%4],wireframe:true,transparent:true,opacity:.55}));m.position.set((Math.random()-.5)*26,(Math.random()-.5)*16,(Math.random()-.5)*14-4);m.userData={s:Math.random()*.01+.003,y:m.position.y,o:Math.random()*6};sc.add(m);ms.push(m)}
const tk=new THREE.Mesh(new THREE.TorusKnotGeometry(1.6,.45,160,20),new THREE.MeshNormalMaterial({transparent:true,opacity:.6}));tk.position.set(6,0,-3);sc.add(tk);const rg=[1,2,3].map(i=>{const m=new THREE.Mesh(new THREE.TorusGeometry(2+i*.9,.035,8,100),new THREE.MeshBasicMaterial({color:C[i],transparent:true,opacity:.75}));m.position.set(-6,0,-3);sc.add(m);return m});const pg=new THREE.BufferGeometry(),pa=new Float32Array(900);for(let i=0;i<900;i++)pa[i]=(Math.random()-.5)*34;pg.setAttribute('position',new THREE.BufferAttribute(pa,3));const pts=new THREE.Points(pg,new THREE.PointsMaterial({size:.07,color:0xffffff}));sc.add(pts);window._u=t=>{tk.rotation.x=t*.4;tk.rotation.y=t*.6;rg.forEach((m,i)=>{m.rotation.x=t*(.3+i*.2);m.rotation.y=t*.4});pts.rotation.y=t*.03};
let mx=0,my=0;addEventListener('mousemove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
function rs(){r.setSize(innerWidth,innerHeight,false);r.setPixelRatio(Math.min(devicePixelRatio,2));cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
(function L(t){t*=.001;window._u&&_u(t);ms.forEach(m=>{m.rotation.x+=m.userData.s;m.rotation.y+=m.userData.s*1.3;m.position.y=m.userData.y+Math.sin(t+m.userData.o)*.5});cam.position.x=mx*3;cam.position.y=-my*2;cam.lookAt(0,0,0);r.render(sc,cam);requestAnimationFrame(L)})(0)}catch(e){}
</script></body></html>
