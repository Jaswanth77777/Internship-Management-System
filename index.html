  class ApplicationStore {
    constructor() {
      this.data = this.load();
      // Always start at the login screen; preserve stored portal data but not an old session.
      this.data.auth.isLoggedIn = false;
      this.data.auth.currentUserToken = null;
      this.data.auth.currentUser = null;
      this.currentView = 'dashboard';
      this.filterMode = '';
      this.minStipendFilter = 0;
      this.loginMode = 'quick'; // 'quick' or 'secure'
      this.theme = localStorage.getItem('internhub_app_theme') || 'dark';
      this.applyTheme();
    }

    load() {
      try {
        const stored = localStorage.getItem('internhub_enterprise_db');
        if (!stored) return JSON.parse(JSON.stringify(INITIAL_DATABASE));
        const parsed = JSON.parse(stored);
        // Ensure all collections exist safely
        if (!parsed.attendance) parsed.attendance = [];
        if (!parsed.applications) parsed.applications = [];
        if (!parsed.nocs) parsed.nocs = [];
        if (!parsed.logs) parsed.logs = [];
        if (!parsed.tasks) parsed.tasks = [];
        if (!parsed.certificates) parsed.certificates = [];
        if (!parsed.auditLogs) parsed.auditLogs = [];
        return parsed;
      } catch (e) {
        return JSON.parse(JSON.stringify(INITIAL_DATABASE));
      }
    }

    save() {
      try {
        localStorage.setItem('internhub_enterprise_db', JSON.stringify(this.data));
        this.broadcastWebSocketUpdate();
      } catch (e) {
        showToast("Storage quota exceeded.", "warning");
      }
    }

    broadcastWebSocketUpdate() {
      // SIMULATED WEBSOCKET REAL-TIME DATA BROADCAST ENGINE
      if (window._socketBroadcastTimeout) clearTimeout(window._socketBroadcastTimeout);
      window._socketBroadcastTimeout = setTimeout(() => {
        const event = new CustomEvent('internhub_ws_sync', { detail: { timestamp: Date.now() } });
        window.dispatchEvent(event);
      }, 300);
    }

    logAudit(action) {
      const time = new Date().toISOString().replace('T', ' ').slice(0, 16);
      const role = this.data.auth.currentUser ? this.data.auth.currentUser.role.toUpperCase() : 'GUEST';
      this.data.auditLogs.unshift({ time, role, action });
      this.save();
    }

    reset() {
      localStorage.removeItem('internhub_enterprise_db');
      this.data = JSON.parse(JSON.stringify(INITIAL_DATABASE));
      this.save();
      showToast("System database restored to clean default state.", "info");
      renderApp();
    }

    toggleTheme() {
      this.theme = this.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('internhub_app_theme', this.theme);
      this.applyTheme();
      renderApp();
    }

    applyTheme() {
      if (this.theme === 'light') {
        document.documentElement.classList.add('light');
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
      }
    }

    // SIMULATED JWT & RBAC SECURITY GUARD
    verifyRolePermission(allowedRoles) {
      const currentUser = this.data.auth.currentUser;
      const token = this.data.auth.currentUserToken;

      if (!token || !currentUser) {
        showToast("JWT Authentication Error: Session expired. Re-login required.", "rose");
        return false;
      }

      if (!allowedRoles.includes(currentUser.role)) {
        showToast(`RBAC Authorization Denied: Action requires [${allowedRoles.join(' / ')}] role authority.`, "rose");
        return false;
      }

      return true;
    }

    // SIMULATED AUTOMATED EMAIL DISPATCHER SERVICE (SendGrid API)
    dispatchEmailNotification(toEmail, subject, bodyContent) {
      showToast(`📧 [SendGrid Dispatcher] Sent to ${toEmail}: "${subject}"`, "info");
      this.logAudit(`Automated Email Dispatched to ${toEmail} | Subject: ${subject}`);
    }
  }

  function showToast(message, type = 'success') {
    const root = document.getElementById('toast-root');
    const toast = document.createElement('div');
    const bg = type === 'success' ? 'bg-emerald-600 text-white' : type === 'warning' ? 'bg-amber-600 text-white' : type === 'info' ? 'bg-cyan-600 text-white' : 'bg-rose-600 text-white';
    
    toast.className = `${bg} px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 text-xs font-semibold pointer-events-auto transform transition-all duration-300 translate-y-4 opacity-0 max-w-sm`;
    toast.innerHTML = `
      <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        ${type === 'success' ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>' : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>'}
      </svg>
      <span>${message}</span>
    `;

    root.appendChild(toast);
    requestAnimationFrame(() => {
      toast.classList.remove('translate-y-4', 'opacity-0');
    });

    setTimeout(() => {
      toast.classList.add('translate-y-4', 'opacity-0');
      setTimeout(() => toast.remove(), 300);
    }, 3800);
  }

  function handleProfileSave(e) {
    e.preventDefault();
    const user = store.data.auth.currentUser;
    user.branch = document.getElementById('prof-branch').value;
    user.gpa = parseFloat(document.getElementById('prof-gpa').value);
    user.skills = document.getElementById('prof-skills').value.split(',').map(s => s.trim()).filter(Boolean);
    user.github = document.getElementById('prof-github').value;
    user.linkedin = document.getElementById('prof-linkedin').value;

    const storedUser = store.data.users.find(u => u.id === user.id);
    if (storedUser) {
      storedUser.gpa = user.gpa;
      storedUser.branch = user.branch;
    }

    store.save();
    store.logAudit(`Updated academic profile for ${user.name}`);
    showToast("Profile records saved successfully!", "success");
    renderApp();
  }

  function handleFileUpload(input) {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) {
      showToast("Rejected: File exceeds 10MB limit.", "rose");
      input.value = '';
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      store.data.auth.currentUser.resume = file.name;
      store.data.auth.currentUser.resumeBlob = e.target.result;
      store.save();
      store.logAudit(`Uploaded File Blob: ${file.name}`);
      showToast(`Cloud storage uploaded file stream: ${file.name}`, "success");
      renderApp();
    };
    reader.readAsDataURL(file);
  }

  function handleAIChatSubmit(e) {
    e.preventDefault();
    const input = document.getElementById('chat-input');
    const query = input.value.trim();
    if (!query) return;

    store.data.chatHistory.push({ sender: 'user', message: query });
    const botReply = generateAIBotReply(query);
    store.data.chatHistory.push({ sender: 'bot', message: botReply });
    store.save();

    input.value = '';
    renderApp();
    setTimeout(() => {
      const container = document.getElementById('chat-messages');
      if (container) container.scrollTop = container.scrollHeight;
    }, 100);
  }

  function generateAIBotReply(query) {
    const q = query.toLowerCase();
    const user = store.data.auth.currentUser;

    if (q.includes('noc')) {
      const noc = store.data.nocs.find(n => n.studentId === user.id);
      return noc ? `Your latest NOC for ${noc.company} is currently: ${noc.status}. Approved by ${noc.approvedBy}.` : "You haven't requested any NOC yet. Open the NOC Generator tab to submit a request.";
    }
    if (q.includes('log') || q.includes('logbook')) {
      const logs = store.data.logs.filter(l => l.studentId === user.id);
      const verified = logs.filter(l => l.status === 'Verified').length;
      return `You have logged ${logs.length} weekly entries. ${verified} out of ${logs.length} entries are verified by supervisors.`;
    }
    if (q.includes('apply') || q.includes('application')) {
      const apps = store.data.applications.filter(a => a.studentId === user.id);
      return `You have ${apps.length} active drive application(s). Check your dashboard table for live status updates.`;
    }
    if (q.includes('stipend') || q.includes('pay')) {
      return `Open drive stipends range from ₹18,000/mo to ₹25,000/mo depending on role specifications and mode.`;
    }
    if (q.includes('interview')) {
      const iv = store.data.interviews.find(i => i.studentId === user.id);
      return iv ? `You have an interview scheduled with ${iv.company} on ${iv.dateTime.replace('T', ' at ')}.` : "No interviews are scheduled right now.";
    }
    return "I can answer questions regarding your NOC status, logbook verification, drive applications, interview schedules, and stipends!";
  }

  function renderSVGQRCode(code) {
    let hash = 0;
    for (let i = 0; i < code.length; i++) hash = (hash * 31 + code.charCodeAt(i)) >>> 0;
    let rects = '';
    for (let y = 0; y < 15; y++) {
      for (let x = 0; x < 15; x++) {
        hash = (hash * 1664525 + 1013904223) >>> 0;
        if ((hash >>> 28) & 1 || (x < 4 && y < 4) || (x > 10 && y < 4) || (x < 4 && y > 10)) {
          rects += `<rect x="${x}" y="${y}" width="0.9" height="0.9" fill="#0f172a"/>`;
        }
      }
    }
    return `<svg viewBox="0 0 15 15" width="120" height="120">${rects}</svg>`;
  }

    const strokeDashoffset = circumference - (percentage / 100) * circumference;

    return `
      <div class="glass-card p-4 rounded-2xl border border-slate-800 flex items-center justify-between">

          <svg class="w-16 h-16 transform -rotate-90">
            <circle cx="32" cy="32" r="${radius}" stroke="currentColor" stroke-width="5" class="text-slate-800" fill="transparent" />
            <circle cx="32" cy="32" r="${radius}" stroke="${colorHex}" stroke-width="5" 
                    stroke-dasharray="${circumference}" 
                    stroke-dashoffset="${strokeDashoffset}" 
                    stroke-linecap="round" 
                    fill="transparent" 
                    class="progress-circle" />
          </svg>
          <span class="absolute text-[10px] font-bold text-slate-200">${percentage}%</span>
        </div>
      </div>
    `;
  }

    const summary = document.getElementById('log-summary').value;

    if (hours > 40) {
      showToast("Validation Error: Logged work hours cannot exceed 40 hours/week cap.", "rose");
      return;
    }

    store.data.logs.push({
      id: Date.now(),
      studentId: user.id,
      week: week,
      date: new Date().toISOString().slice(0, 10),
      summary: summary,
      hours: hours,
      status: "Pending Verification",
      notes: "Awaiting HR sign-off",
      facultyReviewed: false
    });

    store.save();
    store.logAudit(`Submitted Week ${week} Log Entry`);
    showToast(`Week ${week} log submitted!`, 'success');
    renderApp();
  }

  function verifyLog(logId) {
    if (!store.verifyRolePermission(['company', 'admin'])) return;
    const log = store.data.logs.find(l => l.id === logId);
    if (log) {
      log.status = 'Verified';
      log.notes = 'Signed by HR Mentor';
      store.save();
      store.logAudit(`Signed Week ${log.week} Log`);
      showToast(`Log for Week ${log.week} signed!`, 'success');
      renderApp();
    }
  }

  function hireCandidate(appId) {
    if (!store.verifyRolePermission(['company', 'admin'])) return;
    const app = store.data.applications.find(a => a.id === appId);
    if (app) {
      app.status = 'Hired';
      store.data.applications.forEach(other => {
        if (other.studentId === app.studentId && other.id !== appId) {
          other.status = 'Locked';
        }
      });
      store.data.offers.push({
        id: Date.now(),
        studentId: app.studentId,
        studentName: app.studentName,
        company: app.company,
        title: app.title,
        stipend: 25000,
        duration: "6 Months",
        status: "Pending Response",
        offerDate: new Date().toISOString().slice(0, 10)
      });
      store.save();
      store.logAudit(`Hired Candidate ${app.studentName}`);
      showToast(`Candidate ${app.studentName} Hired! Other applications locked.`, 'success');
      renderApp();
    }
  }

  function respondOffer(offerId, response) {
    if (!store.verifyRolePermission(['student'])) return;
    const offer = store.data.offers.find(o => o.id === offerId);
    if (offer) {
      offer.status = response;
      if (response === 'Accepted') {
        const app = store.data.applications.find(a => a.studentId === offer.studentId && a.company === offer.company);
        if (app) app.status = 'Hired';
        store.data.applications.forEach(other => {
          if (other.studentId === offer.studentId && other.company !== offer.company) {
            other.status = 'Locked';
          }
        });
      }
      store.save();
      store.logAudit(`Responded to Offer ${offerId}: ${response}`);
      showToast(`Offer marked as ${response}!`, 'success');
      renderApp();
    }
  }

  function printNOCDocument(nocId) {
    const noc = store.data.nocs.find(n => n.id === nocId);
    if (!noc) return;

    const printArea = document.getElementById('print-area');
    printArea.innerHTML = `
      <div style="padding: 40px; font-family: sans-serif; color: #000; background: #fff;">
        <h2 style="text-align: center; font-size: 20px; font-weight: bold;">NO OBJECTION CERTIFICATE (NOC)</h2>
        <p style="text-align: center; font-size: 12px;">DEPARTMENT OF COMPUTER SCIENCE & ENGINEERING</p>
        <hr style="margin: 20px 0; border: 1px solid #000;" />
        <p>This is to certify that <strong>${noc.studentName}</strong> (Roll No: <strong>${noc.studentId}</strong>) is a bonafide IV Semester student of this institution.</p>
        <p>The institution has NO OBJECTION to the student undertaking an industrial internship at <strong>${noc.company}</strong> for the duration <strong>${noc.duration}</strong>.</p>
        <br/><br/>
        <div style="display: flex; justify-content: space-between; font-size: 12px;">
          <div>
            <p><strong>Date:</strong> ${noc.date}</p>
            <p><strong>Verification Status:</strong> Cryptographically Signed</p>
          </div>
          <div style="text-align: right;">
            <p><strong>Endorsed By:</strong> ${noc.approvedBy}</p>
            <p>Placement Authority</p>
          </div>
        </div>
      </div>
    `;
    window.print();
  }

  function viewApplicationDetail(appId) {
    const app = store.data.applications.find(a => a.id === appId);
    if (!app) return;
    openModal(`
      <div class="glass-card p-6 rounded-2xl max-w-md w-full space-y-4 border border-brand-500/40">
        <h3 class="font-bold text-slate-100">${app.title}</h3>
        <div class="text-xs text-slate-300 space-y-1">
          <div>Company: <strong class="text-brand-400">${app.company}</strong></div>
          <div>Applicant: <strong>${app.studentName} (${app.studentId})</strong></div>
          <div>Applied Date: <strong>${app.appliedDate}</strong></div>
          <div>Status: <span class="px-2 py-0.5 rounded bg-brand-500/20 text-brand-400 font-bold text-[10px]">${app.status}</span></div>
        </div>
        <div class="text-right">
          <button onclick="closeModal()" class="px-4 py-2 bg-slate-800 text-slate-200 text-xs rounded-xl">Close</button>
        </div>
      </div>
    `);
  }

  // MAIN RENDER CONTROLLER
  function renderApp() {
    const root = document.getElementById('app-root');
    if (!store.data.auth.isLoggedIn) {
      root.innerHTML = renderLoginView();
      return;
    }

    const role = store.data.auth.currentUser.role;
    let mainContent = '';

    if (role === 'student') {
      if (store.currentView === 'profile') mainContent = renderStudentProfileView();
      else if (store.currentView === 'internships') mainContent = renderBrowseDrivesView();
      else if (store.currentView === 'noc') mainContent = renderNOCGeneratorView();
      else if (store.currentView === 'logbook') mainContent = renderLogbookView();
      else if (store.currentView === 'tasks') mainContent = renderStudentTasksView();
      else if (store.currentView === 'ai_chat') mainContent = renderAIChatView();
      else if (store.currentView === 'certificates') mainContent = renderCertificatesView();
      else if (store.currentView === 'support') mainContent = renderStudentSupportView();
      else mainContent = renderStudentDashboard();
    } else if (role === 'faculty') {
      if (store.currentView === 'logs_queue') mainContent = renderFacultyLogQueueView();
      else if (store.currentView === 'mentees') mainContent = renderFacultyMenteesView();
      else if (store.currentView === 'issue_cert') mainContent = renderFacultyIssueCertView();
      else mainContent = renderFacultyConsole();
    } else if (role === 'company') {
      if (store.currentView === 'post_drive') mainContent = renderPostDriveView();
      else if (store.currentView === 'interviews') mainContent = renderScheduleInterviewView();
      else if (store.currentView === 'offers') mainContent = renderCompanyOffersView();
      else if (store.currentView === 'evaluations') mainContent = renderCompanyEvaluationsView();
      else mainContent = renderCompanyConsole();
    } else if (role === 'admin') {
      if (store.currentView === 'verify_cos') mainContent = renderAdminVerifyCosView();
      else if (store.currentView === 'authorize_drives') mainContent = renderAdminAuthorizeDrivesView();
      else if (store.currentView === 'allocations') mainContent = renderAdminAllocationsView();
      else if (store.currentView === 'tickets_admin') mainContent = renderAdminTicketsView();
      else if (store.currentView === 'announcements') mainContent = renderAdminAnnouncementsView();
      else mainContent = renderAdminConsole();
    }

    root.innerHTML = `
      ${renderHeader()}
      <div class="flex-1 flex flex-col md:flex-row">
        ${renderSidebar()}
        <main class="flex-1 p-6 overflow-y-auto max-h-[calc(100vh-4rem)] space-y-6">
          ${mainContent}
        </main>
      </div>
    `;
  }

  // THREE.JS 3D SPHERE ENGINE
  function init3DBackground() {
    const canvas = document.getElementById('bg-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 16;

    const sphereGroup = new THREE.Group();
    scene.add(sphereGroup);

    const geo = new THREE.IcosahedronGeometry(3.8, 2);
    const mat = new THREE.MeshBasicMaterial({ color: 0x6366f1, wireframe: true, transparent: true, opacity: 0.3 });
    const sphere = new THREE.Mesh(geo, mat);
    sphereGroup.add(sphere);

    const innerGeo = new THREE.IcosahedronGeometry(2.2, 1);
    const innerMat = new THREE.MeshBasicMaterial({ color: 0xa855f7, wireframe: true, transparent: true, opacity: 0.5 });
    const innerSphere = new THREE.Mesh(innerGeo, innerMat);
    sphereGroup.add(innerSphere);

    const particleCount = 500;
    const positions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 35;
    }
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const pMat = new THREE.PointsMaterial({ size: 0.05, color: 0x06b6d4, transparent: true, opacity: 0.8 });
    const particles = new THREE.Points(pGeo, pMat);
    scene.add(particles);

    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate(t) {
      requestAnimationFrame(animate);
      sphereGroup.rotation.y = t * 0.0004;
      sphereGroup.rotation.x = t * 0.0002;

      camera.position.x += (mouseX * 2 - camera.position.x) * 0.05;
      camera.position.y += (-mouseY * 1.5 - camera.position.y) * 0.05;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }

    animate(0);
  }

  window.onload = () => {
    renderApp();
    init3DBackground();
  };
  </script>
</body>
